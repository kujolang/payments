name: Synthetic verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.suite }} / pinned Linux runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [host, containment]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Verify pinned runtime and install locked dependencies
        run: |
          python3 scripts/deployment/fetch_runtime.py
          echo "KUJO_BIN=$PWD/deployment/.runtime/kujo" >> "$GITHUB_ENV"
          python3 scripts/ci/bootstrap.py
          npm ci --prefix examples/mcp --ignore-scripts --no-audit --no-fund
      - name: Synthetic host suite
        if: matrix.suite == 'host'
        run: bash scripts/test.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: matrix.suite == 'containment'
      - name: Build pinned Workcell host runtime
        if: matrix.suite == 'containment'
        run: |
          python3 scripts/deployment/setup_workcell.py
          echo "PAYMENTS_WORKCELL_ROOT=$PWD/deployment/.workcell/workcell" >> "$GITHUB_ENV"
          echo "PAYMENTS_WORKCELL_KUJO=$PWD/deployment/.workcell/runtime/target/release/kujo" >> "$GITHUB_ENV"
      - name: Current-image components and credential containment
        if: matrix.suite == 'containment'
        run: |
          export PAYMENTS_WORKCELL_EVIDENCE="$RUNNER_TEMP/payments-workcell-evidence"
          bash scripts/deployment/test_oci.sh
      - name: Retain synthetic Workcell evidence
        if: matrix.suite == 'containment' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payments-workcell-evidence
          path: ${{ runner.temp }}/payments-workcell-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Verify tracked inputs were not rewritten
        run: git diff --exit-code
